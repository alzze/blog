<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>{{ post["title"] }} - alzze</title>
  <meta name="description" content={{ post["description"] }} />
  <meta name="author" content="alzze" />
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon.png">

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content={{ post["title"] }} />
  <meta name="twitter:image" content="https://alzze.xyz/img/favicon.png" />

  {% if post["math"]%}
  <script>
      window.MathJax = {
            tex: {
                    inlineMath: [['$', '$'], ['\\(', '\\)']],
                    displayMath: [['$$', '$$'], ['\\[', '\\]']],
                    processEscapes: true
                  }
          };
  </script>
  <script id="MathJax-script" async src="/mathjax/es5/tex-chtml.js"></script>
  {% endif %}

</head>
<body>
  <main>
    <a href="/" style="color:#2a7ae2">all posts</a>
    <h1>{{ post["title"] }}</h1>
    <span>{{ post["date"]}}</span>
    <article>
      {{ post["content"] }}
    </article>
  </main>
  <footer>
    <a href="https://x.com/alzzeat" target="_blank">x.com/alzzeat</a>
  </footer>
</body>
</html>
