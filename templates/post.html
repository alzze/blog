<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  {% set description = post.get('description') or (post['content'] | striptags | truncate(200)) or post['title'] %}
  <title>{{ post["title"] | e }}</title>
  <meta name="description" content="{{ description | e }}" />
  <meta name="author" content="alzze" />
  <link rel="canonical" href="https://alzze.xyz{{ post['url'] | e }}" />
  <link rel="stylesheet" href="/styles.css">

  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="alzze" />
  <meta property="og:title" content="{{ post['title'] | e }}" />
  <meta property="og:description" content="{{ description | e }}" />
  <meta property="og:url" content="https://alzze.xyz{{ post['url'] | e }}" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{ post['title'] | e }}" />
  <meta name="twitter:description" content="{{ description | e }}" />

  {% if post["math"]%}
  <script>
      window.MathJax = {
            tex: {
                    inlineMath: [['$', '$'], ['\\(', '\\)']],
                    displayMath: [['$$', '$$'], ['\\[', '\\]']],
                    processEscapes: true
                  }
          };
  </script>
  <script id="MathJax-script" async src="/mathjax/es5/tex-chtml.js"></script>
  {% endif %}

</head>
<body>
  <main>
    <a href="/" style="color:#2a7ae2">all posts</a>
    <h1>{{ post["title"] | e }}</h1>
    <span>{{ post["date"]}}</span>
    <article>
      {{ post["content"] }}
    </article>
  </main>
  <footer>
    <a href="https://x.com/alzzeat" target="_blank">x.com/alzzeat</a>
  </footer>
</body>
</html>
